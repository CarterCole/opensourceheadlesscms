type ContentEvent {
	contentType: String!
	id: ID!
	mutationType: MutationType!
	item: ContentItem
}

type ContentItem {
	id: ID!
	contentType: String!
	status: String!
	version: Int!
	createdAt: DateTime!
	updatedAt: DateTime!
	createdBy: String!
	updatedBy: String!
	fields: JSON!
}

scalar DateTime

type Global {
	slug: String!
	name: String!
	label: String!
	kind: String!
	item: String!
	storage: String!
	description: String
	public: Boolean!
	value: JSON
	updatedAt: DateTime
	updatedBy: String
}

scalar JSON

type Mutation {
	createContent(type: String!, input: JSON!): ContentItem!
	updateContent(type: String!, id: ID!, input: JSON!): ContentItem!
	transitionContent(type: String!, id: ID!, toState: String!): ContentItem!
	deleteContent(type: String!, id: ID!): Boolean!
	setGlobal(slug: String, name: String, value: JSON!): Global!
}

enum MutationType {
	CREATED
	UPDATED
	DELETED
	TRANSITIONED
}

type Query {
	content(type: String!, id: ID, slug: String): ContentItem
	contentList(type: String!, status: String, page: Int, perPage: Int): [ContentItem!]!
	search(query: String!, contentType: String, page: Int): [SearchResult!]!
	globals(slugs: [String], names: [String]): [Global!]!
	global(slug: String, name: String): Global
	"""
	Site-wide globals, one field per global (camelCase of its slug)
	"""
	site: Site!
}

type SearchResult {
	id: ID!
	contentType: String!
	status: String!
}

type Site {
	"""
	Announcement banner (`announcements`)
	"""
	announcements: [String!]
	"""
	Site keywords (`keywords`)
	"""
	keywords: [String!]
	"""
	Links in the site header, in display order. (`primary-nav`)
	"""
	primaryNav: JSON
	"""
	Site name (`site-name`)
	"""
	siteName: String
	"""
	Theme tokens (`theme`)
	"""
	theme: JSON
}

type Subscription {
	contentChanged(type: String!, id: ID): ContentEvent!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}

