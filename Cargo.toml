[workspace]
members = [
    "crates/cms-core",
    "crates/cms-config",
    "crates/cms-schema",
    "crates/cms-db",
    "crates/cms-flatfile",
    "crates/cms-cache",
    "crates/cms-scripting",
    "crates/cms-rbac",
    "crates/cms-proto",
    "crates/cms-grpc",
    "crates/cms-http",
    "crates/cms-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/YOUR_ORG/opensourceheadlesscms"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web / gRPC
axum = { version = "0.7", features = ["multipart"] }
tonic = "0.11"
tonic-build = "0.11"
prost = "0.12"

# GraphQL
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Caching
moka = { version = "0.12", features = ["future"] }
deadpool-redis = "0.14"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Config
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json"] }
notify = "6"
