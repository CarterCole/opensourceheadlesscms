[workspace]

[package]
name = "opensourceheadlesscms"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/CarterCole/opensourceheadlesscms"

[[bin]]
name = "cms-server"
path = "src/main.rs"

[lib]
name = "opensourceheadlesscms"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web
axum = { version = "0.7", features = ["multipart"] }

# GraphQL
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Caching
moka = { version = "0.12", features = ["future"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Config
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"

# HTTP extras
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Server extras
arc-swap = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
