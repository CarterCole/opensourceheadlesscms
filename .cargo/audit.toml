# Advisory exceptions for `cargo audit`. Every entry needs a reason and an exit condition.

[advisories]
ignore = [
    # Bundled SQLite C library, via libsqlite3-sys 0.30.1. The patched release is >= 0.39,
    # but sqlx-sqlite 0.9.1 (the latest sqlx) still pins libsqlite3-sys ^0.30, so it cannot
    # be updated from here. Medium severity, SQLite backend only. Mitigation in this
    # codebase: all queries use bind parameters, and user search text is turned into quoted
    # FTS5 literals (`db::util::fts5_query`) before it reaches SQLite's query parser.
    # Remove when a sqlx release moves to a patched libsqlite3-sys.
    "RUSTSEC-2026-0459",
]
