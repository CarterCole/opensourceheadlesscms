[workspace]

[package]
name = "opensourceheadlesscms"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/CarterCole/opensourceheadlesscms"
description = "A headless CMS server in Rust: REST + GraphQL APIs, SQLite/PostgreSQL storage, RBAC, flat-file content, and a React admin UI."
readme = "README.md"
keywords = ["cms", "headless", "graphql", "rest", "axum"]
categories = ["web-programming", "web-programming::http-server"]
exclude = ["frontend/", "sdk/", "proto/", "tests/", "content/", ".github/", "demo.sh"]

[[bin]]
name = "cms-server"
path = "src/main.rs"

[lib]
name = "opensourceheadlesscms"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web
axum = { version = "0.8", features = ["multipart", "ws"] }

# GraphQL
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"
async-stream = "0.3"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "uuid", "chrono", "json"] }

# OpenAPI
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Caching
moka = { version = "0.12", features = ["future"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Config
toml = "1.2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"

# HTTP extras
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }

# Server extras
arc-swap = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.11"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
pretty_assertions = "1"
