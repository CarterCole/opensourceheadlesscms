services:
  # ── CMS server (SQLite, no external DB needed for quick-start) ────────────
  cms:
    build: .
    ports:
      # Loopback only by default; put a TLS-terminating reverse proxy in front for
      # anything public. Set CMS_BIND=0.0.0.0 to expose directly.
      - "${CMS_BIND:-127.0.0.1}:8080:8080"
    environment:
      CMS_CONFIG_PATH: /app/cms.toml
      RUST_LOG: cms=info,tower_http=debug
    volumes:
      - cms_data:/app/data            # SQLite file + media
      - ./cms.example.toml:/app/cms.toml:ro
      - ./content-types:/app/content-types:ro
      - ./workflows:/app/workflows:ro
      - ./roles:/app/roles:ro
      - ./content:/app/content        # flat-file mode content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["sqlite"]             # docker compose --profile sqlite up

  # ── Full stack: CMS + PostgreSQL + Redis ──────────────────────────────────
  cms-pg:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Loopback only by default; put a TLS-terminating reverse proxy in front for
      # anything public. Set CMS_BIND=0.0.0.0 to expose directly.
      - "${CMS_BIND:-127.0.0.1}:8080:8080"
    environment:
      CMS_CONFIG_PATH: /app/cms.toml
      RUST_LOG: cms=info,tower_http=debug
      CMS_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. openssl rand -hex 32}
      CMS_DATABASE_URL: postgres://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}
    volumes:
      - ./cms.postgres.toml:/app/cms.toml:ro
      - ./content-types:/app/content-types:ro
      - ./workflows:/app/workflows:ro
      - ./roles:/app/roles:ro
      - ./content:/app/content
    profiles: ["postgres"]           # docker compose --profile postgres up

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  redis:
    image: redis:7-alpine
    profiles: ["postgres"]

volumes:
  cms_data:
  pgdata:
