services:
  # ── CMS server (SQLite, no external DB needed for quick-start) ────────────
  cms:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      CMS_CONFIG_PATH: /app/cms.toml
      RUST_LOG: cms=info,tower_http=debug
    volumes:
      - cms_data:/app/data            # SQLite file + media
      - ./cms.example.toml:/app/cms.toml:ro
      - ./content-types:/app/content-types:ro
      - ./workflows:/app/workflows:ro
      - ./roles:/app/roles:ro
      - ./content:/app/content        # flat-file mode content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["sqlite"]             # docker compose --profile sqlite up

  # ── Full stack: CMS + PostgreSQL + Redis ──────────────────────────────────
  cms-pg:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      CMS_CONFIG_PATH: /app/cms.toml
      RUST_LOG: cms=info,tower_http=debug
    volumes:
      - ./cms.example.toml:/app/cms.toml:ro
      - ./content-types:/app/content-types:ro
      - ./workflows:/app/workflows:ro
      - ./roles:/app/roles:ro
      - ./content:/app/content
    profiles: ["postgres"]           # docker compose --profile postgres up

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["postgres"]

volumes:
  cms_data:
  pgdata:
